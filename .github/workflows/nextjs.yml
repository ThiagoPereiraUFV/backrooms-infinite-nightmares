# Builds the static export and deploys it to GitHub Pages.
name: Deploy Next.js site to Pages

on:
  # Runs once the CI workflow finishes on main, so we never deploy a commit
  # that failed lint/test/build/e2e/audit.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
# Shares the group with ci.yaml's deploy job so the two can never publish simultaneously.
concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  # next.config.ts reads this to set basePath/assetPrefix for Pages hosting.
  NEXT_PUBLIC_BASE_PATH: /backrooms-infinite-nightmares

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    # Skip if the workflow_run that triggered us wasn't a success (manual
    # workflow_dispatch runs always proceed).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # This repo uses Yarn 4 via the packageManager field; corepack provides it.
      - name: Enable corepack
        run: corepack enable
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('yarn.lock') }}-
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build with Next.js
        run: yarn build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
